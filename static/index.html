<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Dashboard - Pörssiseurain</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📈 Portfolio Dashboard</h1>
        <p>Seuraa omia pörssiosakkeita ja rahastoja</p>
        
        <div class="controls">
            <div class="control-group">
                <label for="stockSelect">Valitse osake:</label>
                <select id="stockSelect"></select>
            </div>
            <div class="control-group">
                <label for="timeRange">Aikaväli:</label>
                <select id="timeRange">
                    <option value="1d">24h</option>
                    <option value="1wk" selected>1 viikko</option>
                    <option value="1mo">1 kuukausi</option>
                    <option value="3mo">3 kuukausi</option>
                    <option value="6mo">6 kuukausi</option>
                    <option value="1y">1 vuosi</option>
                </select>
            </div>
            <div class="control-group">
                <label for="stockPrice">Oma ostohinta (EUR):</label>
                <input type="number" id="stockPrice" placeholder="0.00" step="0.01">
            </div>
        </div>
        
        <div id="summarySection" style="display: none;">
            <div class="summary-grid" id="summaryGrid">
                <!-- Summary cards will be generated here -->
            </div>
        </div>
        
        <div class="stock-grid" id="stocksGrid">
            <!-- Stock cards will be generated here -->
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
